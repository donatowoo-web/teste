name: Deploy to Server

on:
  workflow_dispatch:

# Porteiro: só 1 deploy de cada vez. Se o botão Publicar for clicado
# enquanto outro deploy corre, este espera o anterior terminar (não cancela
# a meio) — evita que dois envios FTP em simultâneo colidam e falhem.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_SANITY_WRITE_TOKEN=${{ secrets.SANITY_WRITE_TOKEN }}" >> .env.local
          echo "NEXT_PUBLIC_BACKOFFICE_PASSWORD=${{ secrets.BACKOFFICE_PASSWORD }}" >> .env.local
          echo "NEXT_PUBLIC_DEPLOY_SECRET=${{ secrets.DEPLOY_SECRET }}" >> .env.local
          echo "NEXT_PUBLIC_GH_DEPLOY_TOKEN=${{ secrets.GH_DEPLOY_TOKEN }}" >> .env.local
          echo "NEXT_PUBLIC_GH_REPO=${{ secrets.GH_REPO }}" >> .env.local

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      # Envio por FTP para o servidor (keymachine).
      # Este servidor NAO tem SSH para o utilizador do site — so FTP (porta 21).
      # Sobe o conteudo de out/ para a raiz do FTP (= pasta publica do site).
      # Incremental: depois da 1a vez, so envia ficheiros alterados.
      # NUNCA apaga ficheiros que nao conhece (dangerous-clean-slate: false).
      # Se falhar com erro de TLS/certificado, trocar protocol para: ftp
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ./out/
          dangerous-clean-slate: false
          # Nunca tocar nestes ficheiros do servidor:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github_token
            **/.ftp-deploy-sync-state.json
            **/*.tmp_up
            # Pastas de fotos pesadas (estáticas, já no servidor, nunca mudam pelo
            # backoffice). Excluí-las mantém cada publicação pequena e fiável
            # (evita o limite de ligações FTP do servidor). Se precisares de
            # mudar uma destas fotos, envia-a por FileZilla.
            Casas/**
            plantas/**
            video/**
            gallery/**
